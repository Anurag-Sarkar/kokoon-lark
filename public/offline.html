<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Kokoon Task</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f3; color: #0b0b0b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 360px; padding: 32px 24px; text-align: center; }
    .logo { display: inline-block; width: 44px; height: 44px; border-radius: 12px; background: #0b0b0b; margin-bottom: 20px; }
    h1 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #5c5c58; font-size: 15px; line-height: 1.5; }
    button { background: #0b0b0b; color: #fff; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <span class="logo" aria-hidden="true"></span>
    <h1>You're offline</h1>
    <p>Kokoon Task needs a connection to show your tasks and deadlines. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
